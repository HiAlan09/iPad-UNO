<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UNO Classic">
    <title>UNO 经典版 (Classic UNO) - iPad Pro 12.9寸 典藏四人环绕版</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        html, body {
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            background-color: #080d1a;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        #root {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .safe-top-padding {
            padding-top: max(env(safe-area-inset-top), 10px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        /* 牌桌奢华深蓝星空绒布底色 */
        .felt-table {
            background-color: #0b1329;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.2px, transparent 1.2px),
                              radial-gradient(ellipse at 50% 50%, #1a224a 0%, #060a14 85%);
            background-size: 24px 24px, 100% 100%;
        }

        /* 官方黄金比例尺寸定义 (严格消除细长与压扁变形问题) */
        .card-size-hand {
            width: 96px;
            height: 142px;
        }
        @media (min-width: 640px) {
            .card-size-hand {
                width: 110px;
                height: 162px;
            }
        }
        @media (min-width: 1024px) {
            .card-size-hand {
                width: 122px;
                height: 180px;
            }
        }

        .card-size-center {
            width: 116px;
            height: 170px;
        }
        @media (min-width: 640px) {
            .card-size-center {
                width: 138px;
                height: 204px;
            }
        }
        @media (min-width: 1024px) {
            .card-size-center {
                width: 154px;
                height: 228px;
            }
        }

        .card-size-opponent {
            width: 58px;
            height: 86px;
        }
        @media (min-width: 640px) {
            .card-size-opponent {
                width: 66px;
                height: 98px;
            }
        }

        .card-size-mini {
            width: 44px;
            height: 64px;
        }

        /* 3D 卡牌质感与物理阴影 */
        .uno-card-3d {
            box-shadow: 
                0 4px 8px rgba(0, 0, 0, 0.45),
                0 12px 24px -4px rgba(0, 0, 0, 0.65),
                0 0 0 1.5px rgba(255, 255, 255, 0.28) inset;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center bottom;
        }
        .uno-card-3d:active {
            transform: translateY(-2px) scale(0.96);
        }

        /* 可出牌时的呼吸动效与高光 */
        .card-playable-glow {
            animation: playablePulse 1.6s ease-in-out infinite alternate;
        }
        @keyframes playablePulse {
            0% {
                box-shadow: 0 0 12px #10b981, 0 8px 18px rgba(16, 185, 129, 0.5), 0 0 0 3px #34d399;
                transform: translateY(-8px);
            }
            100% {
                box-shadow: 0 0 24px #059669, 0 14px 28px rgba(16, 185, 129, 0.85), 0 0 0 4px #10b981;
                transform: translateY(-16px);
            }
        }

        .uno-banner-pulse {
            animation: unoAlertPulse 0.85s infinite alternate;
        }
        @keyframes unoAlertPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 6px #ef4444); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 20px #dc2626); }
        }

        /* 玩家操作底座 */
        .wood-rack {
            background: linear-gradient(180deg, #181528 0%, #0d0a17 100%);
            border-top: 3px solid #4f46e5;
            box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.8) inset;
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 24s linear infinite;
        }
        @keyframes spinSlowRev {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .animate-spin-slow-rev {
            animation: spinSlowRev 24s linear infinite;
        }
    </style>
</head>
<body class="bg-[#080d1a] text-slate-100 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Web Audio 原生音效合成器 (免除音频文件加载失败) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playCardPlay() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(560, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }
            playDraw() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(520, this.ctx.currentTime + 0.09);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.09);
                } catch(e) {}
            }
            playAction() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [587.33, 739.99, 880].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + i * 0.06);
                        gain.gain.setValueAtTime(0.2, now + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.06);
                        osc.stop(now + i * 0.06 + 0.12);
                    });
                } catch(e) {}
            }
            playUno() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now + i * 0.07);
                        gain.gain.setValueAtTime(0.26, now + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.07 + 0.18);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.07);
                        osc.stop(now + i * 0.07 + 0.18);
                    });
                } catch(e) {}
            }
            playCatchPenalty() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [650, 420, 220].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + i * 0.1);
                        gain.gain.setValueAtTime(0.25, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.15);
                    });
                } catch(e) {}
            }
            playWin() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.09);
                        gain.gain.setValueAtTime(0.25, now + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.28);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + i * 0.09);
                        osc.stop(now + i * 0.09 + 0.28);
                    });
                } catch(e) {}
            }
        }
        const sfx = new SoundFX();

        const COLORS = {
            red: { name: '红色', hex: '#ef4444', bg: 'bg-red-600', ring: 'ring-red-500', text: 'text-red-500', border: 'border-red-400' },
            yellow: { name: '黄色', hex: '#eab308', bg: 'bg-amber-400', ring: 'ring-amber-400', text: 'text-amber-400', border: 'border-amber-300' },
            green: { name: '绿色', hex: '#16a34a', bg: 'bg-emerald-600', ring: 'ring-emerald-500', text: 'text-emerald-500', border: 'border-emerald-400' },
            blue: { name: '蓝色', hex: '#2563eb', bg: 'bg-blue-600', ring: 'ring-blue-500', text: 'text-blue-500', border: 'border-blue-400' },
            wild: { name: '万能', hex: '#a855f7', bg: 'bg-slate-900', ring: 'ring-purple-500', text: 'text-purple-400', border: 'border-purple-400' }
        };

        const IconBase = ({ children, size = 20, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const BookOpen = (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></IconBase>;
        const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const XIcon = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
        const Layers = (p) => <IconBase {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></IconBase>;
        const Sparkles = (p) => <IconBase {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275-1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></IconBase>;
        const MessageSquare = (p) => <IconBase {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconBase>;
        const HomeIcon = (p) => <IconBase {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>;
        const SettingsIcon = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>;
        const Flame = (p) => <IconBase {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></IconBase>;

        // UNO 官方功能牌图标
        const SkipIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" />
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            </svg>
        );

        const ReverseIcon = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M7 7h10v3l4-4-4-4v3H5a2 2 0 0 0-2 2v5h4V7zm10 10H7v-3l-4 4 4 4v-3h12a2 2 0 0 0 2-2v-5h-4v3z"/>
            </svg>
        );

        const DrawTwoIcon = ({ size = 24, className = "" }) => (
            <div className={`font-black tracking-tighter flex items-center justify-center leading-none ${className}`} style={{ fontSize: size }}>
                +2
            </div>
        );

        const WildIcon = ({ size = 32 }) => (
            <div className="relative rounded-full overflow-hidden border-2 border-white shadow-md shrink-0" style={{ width: size, height: size }}>
                <div className="absolute top-0 left-0 w-1/2 h-1/2 bg-red-600"></div>
                <div className="absolute top-0 right-0 w-1/2 h-1/2 bg-blue-600"></div>
                <div className="absolute bottom-0 left-0 w-1/2 h-1/2 bg-amber-400"></div>
                <div className="absolute bottom-0 right-0 w-1/2 h-1/2 bg-emerald-600"></div>
            </div>
        );

        const WildFourIcon = ({ size = 32 }) => (
            <div className="relative flex flex-col items-center justify-center">
                <WildIcon size={size} />
                <span className="absolute text-white font-black text-xs sm:text-sm drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] stroke-black">
                    +4
                </span>
            </div>
        );

        const generateUnoDeck = () => {
            const cards = [];
            const standardColors = ['red', 'yellow', 'green', 'blue'];

            // 1. 每种颜色 1 张 0 (共 4 张)
            standardColors.forEach(color => {
                cards.push({ id: `c_${color}_0_0`, color, value: 0, type: 'number', score: 0 });
            });

            // 2. 每种颜色 1-9 各两张 (共 72 张)
            for (let copy = 1; copy <= 2; copy++) {
                standardColors.forEach(color => {
                    for (let num = 1; num <= 9; num++) {
                        cards.push({
                            id: `c_${color}_${num}_${copy}`,
                            color,
                            value: num,
                            type: 'number',
                            score: num
                        });
                    }
                });
            }

            // 3. 每种颜色动作牌各 2 张: Skip, Reverse, Draw Two (共 24 张)
            for (let copy = 1; copy <= 2; copy++) {
                standardColors.forEach(color => {
                    cards.push({ id: `c_${color}_skip_${copy}`, color, type: 'skip', score: 20 });
                    cards.push({ id: `c_${color}_reverse_${copy}`, color, type: 'reverse', score: 20 });
                    cards.push({ id: `c_${color}_draw2_${copy}`, color, type: 'draw2', score: 20 });
                });
            }

            // 4. 万能牌各 4 张: Wild (变色), Wild Draw Four (+4) (共 8 张)
            for (let copy = 1; copy <= 4; copy++) {
                cards.push({ id: `c_wild_${copy}`, color: 'wild', type: 'wild', score: 50 });
                cards.push({ id: `c_wild4_${copy}`, color: 'wild', type: 'wild4', score: 50 });
            }

            // 洗牌 Fisher-Yates
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }

            return cards;
        };

        // 核心出牌规则校验引擎
        const checkCardPlayability = (card, topCard, activeColor) => {
            if (!card || !topCard) return { canPlay: false, reason: '' };

            // 1. 万能牌与 +4 牌任何时候均可合法打出
            if (card.color === 'wild') {
                return { canPlay: true, reason: card.type === 'wild4' ? '王牌+4' : '万能变色' };
            }

            // 2. 严格颜色匹配：只要手牌颜色与当前生效颜色相同，无论顶牌是什么均可出
            if (card.color === activeColor) {
                return { canPlay: true, reason: '同色相接' };
            }

            // 3. 只有当顶牌不是万能牌时，才允许跨颜色匹配同数字或同功能
            if (topCard.color !== 'wild') {
                if (card.type === 'number' && topCard.type === 'number' && card.value === topCard.value) {
                    return { canPlay: true, reason: `同数(${card.value})` };
                }
                if (card.type !== 'number' && card.type === topCard.type) {
                    return { canPlay: true, reason: '同功能相接' };
                }
            }

            return { canPlay: false, reason: '' };
        };

        const UnoCard = ({ 
            card, 
            isPlayable = false, 
            playReason = '',
            onClick = null, 
            size = "hand", 
            customClass = "",
            faceDown = false 
        }) => {
            const sizeClass = {
                mini: "card-size-mini",
                tableOpponent: "card-size-opponent",
                hand: "card-size-hand",
                center: "card-size-center"
            }[size] || "card-size-hand";

            if (faceDown) {
                return (
                    <div 
                        onClick={onClick}
                        className={`uno-card-3d relative bg-slate-950 border-2 border-white/90 p-1 flex flex-col items-center justify-center shrink-0 cursor-pointer overflow-hidden rounded-xl sm:rounded-2xl ${sizeClass} ${customClass}`}
                    >
                        <div className="w-full h-full rounded-lg sm:rounded-xl bg-gradient-to-tr from-rose-700 via-red-600 to-amber-600 flex items-center justify-center relative shadow-inner overflow-hidden border border-white/20">
                            <div className="w-[84%] h-[74%] bg-slate-950 rounded-[50%] transform -rotate-[24deg] flex items-center justify-center border-2 border-amber-400 shadow-md">
                                <span className="text-amber-400 font-black italic tracking-tighter text-xs sm:text-sm drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
                                    UNO
                                </span>
                            </div>
                        </div>
                    </div>
                );
            }

            const colorBg = {
                red: "bg-gradient-to-br from-red-500 via-red-600 to-rose-700 border-red-200 text-white",
                yellow: "bg-gradient-to-br from-amber-300 via-yellow-400 to-amber-500 border-amber-100 text-slate-950",
                green: "bg-gradient-to-br from-emerald-500 via-green-600 to-emerald-700 border-emerald-200 text-white",
                blue: "bg-gradient-to-br from-blue-500 via-blue-600 to-indigo-700 border-blue-200 text-white",
                wild: "bg-gradient-to-br from-slate-900 via-slate-800 to-zinc-950 border-purple-300 text-white"
            }[card.color] || "bg-slate-800 border-white text-white";

            const renderBadgeContent = (large = false) => {
                if (card.type === 'number') {
                    const numberColor = card.color === 'yellow' ? 'text-amber-500' :
                                        card.color === 'red' ? 'text-rose-600' :
                                        card.color === 'blue' ? 'text-blue-600' :
                                        card.color === 'green' ? 'text-emerald-600' : 'text-slate-900';

                    return (
                        <span className={`font-black italic font-sans leading-none select-none ${
                            large 
                                ? `text-4xl sm:text-5xl md:text-6xl ${numberColor} drop-shadow-[0_2px_4px_rgba(0,0,0,0.25)]` 
                                : 'text-xs sm:text-sm text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]'
                        }`}>
                            {card.value}
                        </span>
                    );
                }
                if (card.type === 'skip') {

                    { name: "Clawhauser", avatar: "🐆", desc: "豹警官" }
                ];

                const newPlayers = [{ id: 0, ...humanChar, hand: [], calledUno: false }];
                for (let i = 1; i < cfg.playerCount; i++) {
                    const bot = botRoster[i - 1];
                    newPlayers.push({
                        id: i,
                        name: bot.name,
                        avatar: bot.avatar,
                        desc: bot.desc,
                        isComputer: true,
                        hand: [],
                        calledUno: false
                    });
                }

                newPlayers.forEach(p => {
                    p.hand = fullDeck.splice(0, 7);
                });

                let firstCard = fullDeck.pop();
                while (firstCard.type === 'wild4') {
                    fullDeck.unshift(firstCard);
                    firstCard = fullDeck.pop();
                }

                const initialDiscard = [firstCard];
                const initialColor = firstCard.color === 'wild' ? 'red' : firstCard.color;

                setDeck(fullDeck);
                setDiscardPile(initialDiscard);
                setCurrentColor(initialColor);
                setPlayers(newPlayers);
                setTurnIndex(0);
                setPlayDirection(1);
                setDrawnThisTurn(false);
                setJustDrawnCardId(null);
                setPlayerCalledUno(false);
                setCatchUnoTarget(null);
                setWinner(null);
                setGameState('playing');
                setShowConfig(false);

                setLogs([`开局成功！${cfg.playerCount} 人环桌对决，每人 7 张手牌。起始牌为 [${firstCard.type === 'number' ? firstCard.value : firstCard.type}]！`]);
                notify(`轮到你的回合 (${humanChar.name})，请出牌或摸牌！`, "info");
            };

            const nextTurn = (fromIdx, step = 1, currentPlayers, currentDeck, currentDiscard, activeColor, dir = playDirection) => {
                if (aiTimeoutRef.current) {
                    clearTimeout(aiTimeoutRef.current);
                    aiTimeoutRef.current = null;
                }

                const total = currentPlayers.length;
                let nextIdx = (fromIdx + (dir * step)) % total;
                if (nextIdx < 0) nextIdx += total;

                setTurnIndex(nextIdx);
                setDrawnThisTurn(false);
                setJustDrawnCardId(null);
                setPlayerCalledUno(false);

                const nextPlayer = currentPlayers[nextIdx];

                if (nextPlayer.isComputer) {
                    aiTimeoutRef.current = setTimeout(() => {
                        runAITurn(nextIdx, currentPlayers, currentDeck, currentDiscard, activeColor, dir);
                    }, 1200);
                } else {
                    notify(`轮到你的回合 (${nextPlayer.name})！`, "info");
                }
            };

            const handleDrawCard = () => {
                if (!isHumanTurn || drawnThisTurn) return;

                sfx.playDraw();
                let freshDeck = [...deck];
                let freshDiscard = [...discardPile];

                if (freshDeck.length === 0) {
                    if (freshDiscard.length <= 1) {
                        notify("牌库与弃牌堆已全部抽尽，无法继续摸牌！", "warning");
                        return;
                    }
                    const top = freshDiscard.pop();
                    freshDeck = freshDiscard;
                    for (let i = freshDeck.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [freshDeck[i], freshDeck[j]] = [freshDeck[j], freshDeck[i]];
                    }
                    freshDiscard = [top];
                    addLog("牌库耗尽，已重新将弃牌堆洗牌归入牌库！");
                }

                const drawn = freshDeck.pop();
                const updatedPlayers = [...players];
                updatedPlayers[0].hand.push(drawn);

                setDeck(freshDeck);
                setDiscardPile(freshDiscard);
                setPlayers(updatedPlayers);
                setDrawnThisTurn(true);
                setJustDrawnCardId(drawn.id);

                const { canPlay, reason } = checkCardPlayability(drawn, topDiscard, currentColor);
                if (canPlay) {
                    notify(`摸到了合规牌 [${drawn.type === 'number' ? drawn.value : drawn.type}] (${reason})！你可以立即打出，或点击「过牌跳过」。`, "info");
                } else {
                    notify(`摸到了牌 [${drawn.type === 'number' ? drawn.value : drawn.type}]，不可打出。点击「过牌跳过」结束本回合。`, "warning");
                }

                addLog(`${humanPlayer.name} 摸了 1 张牌。`);
            };

            const handlePassTurn = () => {
                if (!isHumanTurn || !drawnThisTurn) return;
                sfx.playCardPlay();
                addLog(`${humanPlayer.name} 摸牌后选择了过牌跳过。`);
                nextTurn(0, 1, players, deck, discardPile, currentColor);
            };

            const handleCallUno = () => {
                if (!isHumanTurn) return;
                sfx.playUno();
                setPlayerCalledUno(true);
                const updatedPlayers = [...players];
                updatedPlayers[0].calledUno = true;
                setPlayers(updatedPlayers);
                notify("🔥 你高声喊出了「UNO!」！全场警惕！", "info");
                addLog(`📣 ${humanPlayer.name} 高呼「UNO!」！`);
            };

            const handleCatchUno = () => {
                if (!catchUnoTarget) return;
                sfx.playCatchPenalty();

                const targetIdx = players.findIndex(p => p.id === catchUnoTarget.id);
                if (targetIdx === -1) return;

                let freshDeck = [...deck];
                let penaltyCards = [];
                for (let i = 0; i < 2; i++) {
                    if (freshDeck.length > 0) penaltyCards.push(freshDeck.pop());
                }

                const updatedPlayers = [...players];
                updatedPlayers[targetIdx].hand.push(...penaltyCards);
                setDeck(freshDeck);
                setPlayers(updatedPlayers);
                setCatchUnoTarget(null);

                notify(`🚨 捉包成功！${catchUnoTarget.name} 只剩 1 张牌却漏喊 UNO，被罚抽 2 张牌！`, "warning");
                addLog(`🚨 捉包！${catchUnoTarget.name} 未喊 UNO，被罚抽 2 张牌！`);
            };

            const handlePlayCard = (card) => {
                if (!isHumanTurn) return;

                const { canPlay } = checkCardPlayability(card, topDiscard, currentColor);
                if (!canPlay) {
                    notify(`违规！当前牌桌指定为【${COLORS[currentColor]?.name}】，该牌无法打出！`, "error");
                    return;
                }

                const willHaveOneCardLeft = humanPlayer.hand.length === 2;
                if (willHaveOneCardLeft && !playerCalledUno) {
                    setCatchUnoTarget(humanPlayer);
                    setTimeout(() => setCatchUnoTarget(null), 3500);
                }

                if (card.color === 'wild') {
                    setPendingWildCard(card);
                    setShowColorModal(true);
                    return;
                }

                executeCardCommit(card, card.color, 0);
            };

            const handleSelectWildColor = (selectedColor) => {
                setShowColorModal(false);
                if (!pendingWildCard) return;
                const card = pendingWildCard;
                setPendingWildCard(null);
                executeCardCommit(card, selectedColor, 0);
            };

            const executeCardCommit = (card, activeColor, playerIdx) => {
                sfx.playCardPlay();

                const actingPlayer = players[playerIdx];
                const updatedPlayers = [...players];
                const updatedHand = actingPlayer.hand.filter(c => c.id !== card.id);
                updatedPlayers[playerIdx].hand = updatedHand;

                const newDiscard = [...discardPile, card];
                setCurrentColor(activeColor);
                setPlayers(updatedPlayers);
                setDiscardPile(newDiscard);

                addLog(`${actingPlayer.name} 打出了 [${COLORS[activeColor]?.name || ''} ${card.type === 'number' ? card.value : card.type}]！`);

                if (updatedHand.length === 0) {
                    handleVictory(actingPlayer, updatedPlayers);
                    return;
                }

                let step = 1;
                let currentDir = playDirection;
                let freshDeck = [...deck];

                if (card.type === 'reverse') {
                    sfx.playAction();
                    if (players.length === 2) {
                        step = 2;
                        notify("🔄 2人对局反转！获得连续出牌机会！", "info");
                    } else {
                        currentDir = currentDir * -1;
                        setPlayDirection(currentDir);
                        notify(`🔄 出牌方向反转为 ${currentDir === 1 ? '顺时针 ↻' : '逆时针 ↺'}！`, "info");
                    }
                } else if (card.type === 'skip') {
                    sfx.playAction();
                    step = 2;
                    notify("🚫 禁止牌生效！下家被跳过出牌！", "info");
                } else if (card.type === 'draw2') {
                    sfx.playAction();
                    step = 2;
                    const nextPIdx = (playerIdx + currentDir + players.length) % players.length;
                    const drawnCards = [];
                    for (let i = 0; i < 2; i++) {
                        if (freshDeck.length > 0) drawnCards.push(freshDeck.pop());
                    }
                    updatedPlayers[nextPIdx].hand.push(...drawnCards);
                    setDeck(freshDeck);
                    notify(`⚡ +2 生效！${players[nextPIdx].name} 被罚摸 2 张牌并跳过！`, "warning");
                    addLog(`⚡ +2 生效！${players[nextPIdx].name} 摸了 2 张牌并被跳过。`);
                } else if (card.type === 'wild4') {
                    sfx.playAction();
                    step = 2;
                    const nextPIdx = (playerIdx + currentDir + players.length) % players.length;
                    const drawnCards = [];
                    for (let i = 0; i < 4; i++) {
                        if (freshDeck.length > 0) drawnCards.push(freshDeck.pop());
                    }
                    updatedPlayers[nextPIdx].hand.push(...drawnCards);
                    setDeck(freshDeck);
                    notify(`🌈 +4 降临！${players[nextPIdx].name} 被罚摸 4 张牌并跳过！`, "warning");
                    addLog(`🌈 +4 生效！${players[nextPIdx].name} 摸了 4 张牌并被跳过。`);
                }

                nextTurn(playerIdx, step, updatedPlayers, freshDeck, newDiscard, activeColor, currentDir);
            };

            const runAITurn = (aiIdx, currentPlayers, currentDeck, currentDiscard, activeColor, dir) => {
                const ai = currentPlayers[aiIdx];
                const top = currentDiscard[currentDiscard.length - 1];

                if (catchUnoTarget && !catchUnoTarget.isComputer && Math.random() < 0.75) {
                    sfx.playCatchPenalty();
                    let freshDeck = [...currentDeck];
                    const penalty = [];
                    for (let i = 0; i < 2; i++) {
                        if (freshDeck.length > 0) penalty.push(freshDeck.pop());
                    }
                    const targetIdx = currentPlayers.findIndex(p => p.id === catchUnoTarget.id);
                    currentPlayers[targetIdx].hand.push(...penalty);
                    setDeck(freshDeck);
                    setPlayers(currentPlayers);
                    notify(`🚨 🤖 ${ai.name} 发现了你忘记喊 UNO，重罚你摸 2 张牌！`, "error");
                    addLog(`🚨 ${ai.name} 捉包！罚 ${catchUnoTarget.name} 抽 2 张牌！`);
                    setCatchUnoTarget(null);
                }

                const playableCards = ai.hand.filter(c => checkCardPlayability(c, top, activeColor).canPlay);

                if (playableCards.length > 0) {
                    const nextPIdx = (aiIdx + dir + currentPlayers.length) % currentPlayers.length;
                    const nextPlayerCardCount = currentPlayers[nextPIdx].hand.length;

                    let chosenCard = null;
                    if (nextPlayerCardCount <= 2) {
                        chosenCard = playableCards.find(c => c.type === 'wild4' || c.type === 'draw2' || c.type === 'skip');
                    }
                    if (!chosenCard) {
                        chosenCard = playableCards.find(c => c.color === activeColor && c.type === 'number')
                            || playableCards.find(c => c.type === 'number')
                            || playableCards.find(c => c.type === 'draw2' || c.type === 'skip' || c.type === 'reverse')
                            || playableCards[0];
                    }

                    if (ai.hand.length === 2 && Math.random() < 0.85) {
                        ai.calledUno = true;
                        sfx.playUno();
                        notify(`📣 🤖 ${ai.name} 大喊了一声「UNO!」！`, "warning");
                        addLog(`📣 🤖 ${ai.name} 高喊「UNO!」！`);
                    } else if (ai.hand.length === 2) {
                        setCatchUnoTarget(ai);
                        setTimeout(() => setCatchUnoTarget(null), 3500);
                    }

                    let chosenColor = chosenCard.color;
                    if (chosenCard.color === 'wild') {
                        const colorCounts = { red: 0, yellow: 0, green: 0, blue: 0 };
                        ai.hand.forEach(c => {
                            if (c.color !== 'wild') colorCounts[c.color]++;
                        });
                        chosenColor = Object.keys(colorCounts).reduce((a, b) => colorCounts[a] > colorCounts[b] ? a : b);
                    }

                    ai.hand = ai.hand.filter(c => c.id !== chosenCard.id);
                    const newDiscard = [...currentDiscard, chosenCard];
                    setCurrentColor(chosenColor);
                    setDiscardPile(newDiscard);
                    setPlayers([...currentPlayers]);

                    sfx.playCardPlay();
                    addLog(`🤖 ${ai.name} 打出了 [${COLORS[chosenColor]?.name || ''} ${chosenCard.type === 'number' ? chosenCard.value : chosenCard.type}]！`);

                    if (ai.hand.length === 0) {
                        handleVictory(ai, currentPlayers);
                        return;
                    }

                    let step = 1;
                    let currentDir = dir;
                    let freshDeck = [...currentDeck];

                    if (chosenCard.type === 'reverse') {
                        sfx.playAction();
                        if (currentPlayers.length === 2) {
                            step = 2;
                        } else {
                            currentDir = currentDir * -1;
                            setPlayDirection(currentDir);
                        }
                    } else if (chosenCard.type === 'skip') {
                        sfx.playAction();
                        step = 2;
                    } else if (chosenCard.type === 'draw2') {
                        sfx.playAction();
                        step = 2;
                        const targetP = currentPlayers[(aiIdx + currentDir + currentPlayers.length) % currentPlayers.length];
                        const drawn = [];
                        for (let i = 0; i < 2; i++) {
                            if (freshDeck.length > 0) drawn.push(freshDeck.pop());
                        }
                        targetP.hand.push(...drawn);
                        setDeck(freshDeck);
                    } else if (chosenCard.type === 'wild4') {
                        sfx.playAction();
                        step = 2;
                        const targetP = currentPlayers[(aiIdx + currentDir + currentPlayers.length) % currentPlayers.length];
                        const drawn = [];
                        for (let i = 0; i < 4; i++) {
                            if (freshDeck.length > 0) drawn.push(freshDeck.pop());
                        }
                        targetP.hand.push(...drawn);
                        setDeck(freshDeck);
                    }

                    nextTurn(aiIdx, step, currentPlayers, freshDeck, newDiscard, chosenColor, currentDir);
                } else {
                    sfx.playDraw();
                    let freshDeck = [...currentDeck];
                    if (freshDeck.length > 0) {
                        const drawn = freshDeck.pop();
                        ai.hand.push(drawn);
                        setDeck(freshDeck);
                        addLog(`🤖 ${ai.name} 思考后摸了 1 张牌。`);

                        const { canPlay: drawnCanPlay } = checkCardPlayability(drawn, top, activeColor);
                        if (drawnCanPlay) {
                            let drawColor = drawn.color === 'wild' ? 'red' : drawn.color;
                            ai.hand = ai.hand.filter(c => c.id !== drawn.id);
                            const newDiscard = [...currentDiscard, drawn];
                            setCurrentColor(drawColor);
                            setDiscardPile(newDiscard);
                            setPlayers([...currentPlayers]);
                            sfx.playCardPlay();
                            addLog(`🤖 ${ai.name} 摸到合规牌，顺势打出 [${drawn.type === 'number' ? drawn.value : drawn.type}]！`);

                            if (ai.hand.length === 0) {
                                handleVictory(ai, currentPlayers);
                                return;
                            }
                        }
                    }
                    nextTurn(aiIdx, 1, currentPlayers, freshDeck, currentDiscard, activeColor, dir);
                }
            };

            const handleVictory = (winningPlayer, allPlayers) => {
                sfx.playWin();
                let roundScore = 0;
                allPlayers.forEach(p => {
                    if (p.id !== winningPlayer.id) {
                        p.hand.forEach(c => roundScore += c.score);
                    }
                });

                winningPlayer.score = (winningPlayer.score || 0) + roundScore;
                setWinner({ ...winningPlayer, roundScore });
                setGameState('end');
                addLog(`🏆 恭喜！${winningPlayer.name} 清空手牌，斩获 UNO 最终胜利！获得 ${roundScore} 分！`);
            };

            const sortHandByColor = () => {
                sfx.playCardPlay();
                const updatedPlayers = [...players];
                const colorOrder = { red: 1, yellow: 2, green: 3, blue: 4, wild: 5 };
                updatedPlayers[0].hand.sort((a, b) => {
                    if (colorOrder[a.color] !== colorOrder[b.color]) {
                        return colorOrder[a.color] - colorOrder[b.color];
                    }
                    return (a.value || 99) - (b.value || 99);
                });
                setPlayers(updatedPlayers);
            };

            const sortHandByNumber = () => {
                sfx.playCardPlay();
                const updatedPlayers = [...players];
                updatedPlayers[0].hand.sort((a, b) => {
                    const valA = a.type === 'number' ? a.value : 10;
                    const valB = b.type === 'number' ? b.value : 10;
                    return valA - valB;
                });
                setPlayers(updatedPlayers);
            };

            const provideSmartHint = () => {
                if (!isHumanTurn) return;
                sfx.playAction();
                const legalCards = (humanPlayer?.hand || []).map(c => ({
                    card: c,
                    ...checkCardPlayability(c, topDiscard, currentColor)
                })).filter(x => x.canPlay);

                if (legalCards.length > 0) {
                    const best = legalCards[0];
                    notify(`💡 出牌提示：手中的 [${COLORS[best.card.color]?.name || ''} ${best.card.type === 'number' ? best.card.value : best.card.type}] 可以合规打出 (${best.reason})！`, "info");
                } else {
                    notify("💡 出牌提示：手牌暂无匹配牌，请点击摸牌堆摸 1 张牌！", "warning");
                }
            };

            if (gameState === 'setup') {
                return (
                    <div className="h-full w-full flex flex-col items-center justify-center bg-[#080d1a] text-white p-4 relative overflow-hidden felt-table safe-top-padding">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-red-600/10 rounded-full blur-[100px] pointer-events-none"></div>

                        <div className="relative z-10 flex flex-col items-center mb-10">
                            <div className="p-3.5 bg-red-600/20 rounded-3xl border-2 border-red-500/40 mb-4 shadow-[0_0_40px_rgba(239,68,68,0.4)]">
                                <WildIcon size={76} />
                            </div>
                            <h1 className="text-6xl sm:text-7xl md:text-8xl font-black italic bg-gradient-to-r from-red-500 via-amber-400 to-yellow-500 bg-clip-text text-transparent tracking-wider uppercase drop-shadow-2xl text-center leading-none">
                                UNO!
                            </h1>
                            <div className="text-xs sm:text-sm font-black text-amber-300 tracking-[0.35em] uppercase mt-3">
                                四人环形牌桌 · 黄金比例豪华版
                            </div>
                        </div>

                        <div className="relative z-20 flex flex-col sm:flex-row items-center gap-4 w-full max-w-md justify-center">
                            <button 
                                onClick={() => setShowConfig(true)}
                                className="h-14 w-48 sm:w-52 bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 hover:from-red-500 hover:to-amber-500 rounded-full text-white font-black text-base sm:text-lg shadow-[0_0_35px_rgba(239,68,68,0.45)] transform transition-all active:scale-95 border-2 border-white/20 whitespace-nowrap flex items-center justify-center"
                            >
                                开始游戏
                            </button>
                            <button
                                onClick={() => setShowRules(true)}
                                className="h-14 w-48 sm:w-52 bg-slate-800/90 hover:bg-slate-750 border-2 border-slate-600 text-slate-200 font-bold text-base sm:text-lg rounded-full transition-all active:scale-95 whitespace-nowrap flex items-center justify-center gap-2 shadow-lg"
                            >
                                <BookOpen size={20} />
                                <span>玩法与规则</span>
                            </button>
                        </div>
                        
                        <div className="absolute bottom-4 text-slate-500 text-xs font-mono">
                            iPad Pro 12.9" Optimized · 108 Cards Classic Quad Arena
                        </div>

                        {showConfig && (
                            <ConfigModal 
                                config={config} 
                                setConfig={setConfig} 
                                onStart={() => startNewMatch(config)} 
                                onClose={() => setShowConfig(false)} 
                            />
                        )}

                        {showRules && <RuleModal onClose={() => setShowRules(false)} />}
                    </div>
                );
            }

            const humanHand = humanPlayer?.hand || [];
            
            const opponentLeft = config.playerCount >= 3 ? players[1] : null;
            const opponentTop = config.playerCount === 2 ? players[1] : (config.playerCount >= 3 ? players[2] : null);
            const opponentRight = config.playerCount >= 4 ? players[3] : null;

            // 渲染对手席位：左右两边竖向排列，顶部横向排列
            const renderOpponentSeat = (player, position) => {
                if (!player) return null;
                const isTurn = turnIndex === player.id;
                const isSide = position === 'left' || position === 'right';

                return (
                    <div className={`flex flex-col items-center z-20 transition-all duration-300 p-2 sm:p-2.5 rounded-2xl ${
                        isTurn ? 'bg-indigo-950/85 border-2 border-indigo-400 ring-4 ring-indigo-500/40 shadow-2xl scale-105' : 'bg-slate-900/70 border border-slate-800 shadow-lg'
                    }`}>
                        {/* 玩家头像与信息状态 */}
                        <div className="flex items-center gap-2 mb-1.5 whitespace-nowrap">
                            <span className="text-2xl leading-none">{player.avatar}</span>
                            <div className="text-left">
                                <div className="text-xs font-black text-white flex items-center gap-1">
                                    <span>{player.name}</span>
                                    {isTurn && (
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    )}
                                </div>
                                <div className="text-[10px] text-slate-400 font-mono">
                                    手牌: <b className="text-amber-400">{player.hand.length}</b> 张
                                </div>
                            </div>
                            {player.hand.length === 1 && (
                                <span className="px-1.5 py-0.5 rounded-full bg-red-600 text-white font-black text-[9px] uno-banner-pulse ml-1">
                                    UNO!
                                </span>
                            )}
                        </div>

                        {/* 对手手牌展示：左右席位严格竖向层叠排列，顶部席位横向层叠 */}
                        {isSide ? (
                            <div className="flex flex-col items-center justify-center -space-y-14 sm:-space-y-16 py-1.5 overflow-visible">
                                {player.hand.slice(0, 7).map((_, idx) => (
                                    <UnoCard 
                                        key={idx} 
                                        faceDown={true} 
                                        size="tableOpponent" 
                                        customClass="shadow-lg transform transition-transform"
                                    />
                                ))}
                                {player.hand.length > 7 && (
                                    <div className="w-[58px] sm:w-[66px] h-7 rounded-xl bg-slate-900/90 border-2 border-amber-400/80 flex items-center justify-center text-xs font-black text-amber-300 shadow-md z-30 mt-1">
                                        +{player.hand.length - 7}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="flex flex-row items-center justify-center -space-x-8 sm:-space-x-10 py-1 overflow-visible">
                                {player.hand.slice(0, 8).map((_, idx) => (
                                    <UnoCard 
                                        key={idx} 
                                        faceDown={true} 
                                        size="tableOpponent" 
                                        customClass="shadow-lg"
                                    />
                                ))}
                                {player.hand.length > 8 && (
                                    <div className="w-8 h-[86px] sm:h-[98px] rounded-xl bg-slate-900/90 border-2 border-amber-400/80 flex items-center justify-center text-xs font-black text-amber-300 shadow-md z-30 ml-1">
                                        +{player.hand.length - 8}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="h-full w-full bg-[#080d1a] text-slate-100 flex flex-col overflow-hidden font-sans safe-top-padding">
                    {showRules && <RuleModal onClose={() => setShowRules(false)} />}
                    {showConfig && (
                        <ConfigModal 
                            config={config} 
                            setConfig={setConfig} 
                            onStart={() => startNewMatch(config)} 
                            onClose={() => setShowConfig(false)} 
                        />
                    )}
                    {showLogs && <LogModal logs={logs} onClose={() => setShowLogs(false)} />}
                    {showColorModal && <ColorSelectModal onSelectColor={handleSelectWildColor} />}

                    {/* 顶栏控制台 */}
                    <div className="h-14 py-1.5 bg-slate-900/95 border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between z-30 shrink-0 shadow-lg gap-2 overflow-x-auto custom-scrollbar">
                        <div className="flex items-center gap-2 shrink-0">
                            <div className="p-1 bg-red-600/15 rounded-xl border border-red-500/40 flex items-center justify-center shrink-0">
                                <WildIcon size={22} />
                            </div>
                            <div className="flex flex-col justify-center">
                                <div className="font-black text-red-500 text-base sm:text-lg leading-none tracking-wider whitespace-nowrap italic">
                                    UNO CLASSIC
                                </div>
                                <div className="text-[10px] text-amber-400 font-bold whitespace-nowrap leading-none mt-1">
                                    四人环桌对决 · 官方正规规则
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-800/90 border border-slate-700/80 text-xs shrink-0 whitespace-nowrap ml-2">
                                <Layers size={13} className="text-amber-400" />
                                <span className="text-slate-400">牌堆:</span>
                                <span className="font-bold text-amber-300 font-mono">{deck.length}</span>
                            </div>

                            <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-800/90 border border-slate-700/80 text-xs shrink-0 whitespace-nowrap">
                                <span className="text-slate-400">方向:</span>
                                <span className="font-black text-emerald-400 flex items-center gap-1 font-mono">
                                    {playDirection === 1 ? '顺时针 ↻' : '逆时针 ↺'}
                                </span>
                            </div>
                        </div>

                        <div className="flex items-center gap-1.5 shrink-0">
                            <button
                                onClick={() => setShowLogs(true)}
                                className="flex items-center gap-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold transition-all active:scale-95 whitespace-nowrap"
                            >
                                <MessageSquare size={14} className="text-amber-400" />
                                <span>动态</span>
                            </button>
                            <button
                                onClick={() => setShowRules(true)}
                                className="flex items-center gap-1 px-2.5 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/30 rounded-xl text-xs font-bold transition-all active:scale-95 whitespace-nowrap"
                            >
                                <BookOpen size={14} />
                                <span>规则</span>
                            </button>
                            <button
                                onClick={() => setShowConfig(true)}
                                className="flex items-center gap-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold transition-all active:scale-95 whitespace-nowrap"
                            >
                                <SettingsIcon size={14} />
                                <span>设置</span>
                            </button>
                            <button
                                onClick={() => setGameState('setup')}
                                className="flex items-center gap-1 px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 rounded-xl text-xs font-bold transition-all active:scale-95 whitespace-nowrap"
                                title="返回主页"
                            >
                                <HomeIcon size={14} />
                            </button>
                        </div>
                    </div>

                    {/* 牌桌中央竞技区域：四周环绕布局 (Top, Left, Right, Bottom) */}
                    <div className="flex-1 flex flex-col overflow-hidden min-h-0 relative felt-table p-2 sm:p-3">
                        {/* 顶部对手位 (Top) */}
                        <div className="w-full flex justify-center shrink-0 min-h-[90px]">
                            {renderOpponentSeat(opponentTop, 'top')}
                        </div>

                        {/* 中间层：左对手(竖向排列) + 牌桌中心(摸牌/弃牌/转盘) + 右对手(竖向排列) */}
                        <div className="flex-1 flex items-center justify-between min-h-0 relative my-1 px-2 sm:px-4">
                            {/* 左侧对手位 (Left - 竖向排列) */}
                            <div className="w-24 sm:w-32 lg:w-40 flex flex-col justify-center items-center shrink-0 z-20">
                                {renderOpponentSeat(opponentLeft, 'left')}
                            </div>

                            {/* 牌桌正中心：旋转星轨 + 摸牌堆 + 弃牌堆 + 颜色指示器 */}
                            <div className="flex-1 flex flex-col items-center justify-center relative h-full">
                                <div className={`absolute w-72 h-72 sm:w-96 sm:h-96 rounded-full border-2 border-dashed border-indigo-500/25 pointer-events-none ${
                                    playDirection === 1 ? 'animate-spin-slow' : 'animate-spin-slow-rev'
                                }`}></div>

                                {notification && (
                                    <div className="absolute -top-3 z-40 animate-pop px-4 py-1.5 rounded-full shadow-2xl border text-xs sm:text-sm font-bold flex items-center gap-2 backdrop-blur-md whitespace-nowrap bg-slate-900/90 border-amber-400/80 text-amber-300">
                                        <Sparkles size={14} className="text-amber-400" />
                                        <span>{notification.msg}</span>
                                    </div>
                                )}

                                {catchUnoTarget && (
                                    <div className="absolute -bottom-4 z-40 animate-bounce">
                                        <button
                                            onClick={handleCatchUno}
                                            className="px-5 py-2.5 rounded-full bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 text-white font-black text-xs sm:text-sm shadow-2xl flex items-center gap-2 border-2 border-yellow-300 active:scale-95"
                                        >
                                            <Flame size={18} className="text-yellow-300" />
                                            <span>捉包！发现 {catchUnoTarget.name} 未喊 UNO！(罚抽2张)</span>
                                        </button>
                                    </div>
                                )}

                                <div className="flex items-center gap-8 sm:gap-14 z-10">
                                    {/* 摸牌堆 (Draw Pile) */}
                                    <div className="flex flex-col items-center gap-2">
                                        <div 
                                            onClick={handleDrawCard}
                                            className={`relative cursor-pointer group active:scale-95 transition-transform ${
                                                isHumanTurn && !drawnThisTurn ? 'ring-4 ring-emerald-400/80 rounded-xl sm:rounded-2xl' : 'opacity-90'
                                            }`}
                                        >
                                            <UnoCard faceDown={true} size="center" />
                                            <div className="absolute -bottom-2.5 -right-2.5 px-3 py-1 rounded-full bg-slate-950 text-white font-mono font-bold text-xs border border-slate-700 shadow-lg">
                                                {deck.length}
                                            </div>
                                        </div>
                                        <span className="text-xs font-bold text-slate-300">
                                            摸牌堆 (点击摸牌)
                                        </span>
                                    </div>

                                    {/* 弃牌堆 (Discard Pile) */}
                                    <div className="flex flex-col items-center gap-2">
                                        <div className="relative">
                                            {topDiscard && (
                                                <UnoCard 
                                                    card={topDiscard} 
                                                    size="center" 
                                                    customClass="border-4 border-white/95 shadow-2xl" 
                                                />
                                            )}
                                            <div className={`absolute -top-4 left-1/2 -translate-x-1/2 px-3.5 py-1 rounded-full text-xs font-black shadow-xl border border-white/50 flex items-center gap-1.5 whitespace-nowrap text-white ${COLORS[currentColor]?.bg || 'bg-slate-800'}`}>
                                                <span>当前颜色:</span>
                                                <span className="font-black underline">{COLORS[currentColor]?.name || ''}</span>
                                            </div>
                                        </div>
                                        <span className="text-xs font-bold text-slate-300">
                                            弃牌堆 (当前牌)
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* 右侧对手位 (Right - 竖向排列) */}
                            <div className="w-24 sm:w-32 lg:w-40 flex flex-col justify-center items-center shrink-0 z-20">
                                {renderOpponentSeat(opponentRight, 'right')}
                            </div>
                        </div>
                    </div>

                    {/* 底部玩家专属操作牌架：清晰可辨认的黄金比例手牌 */}
                    <div className="h-[270px] sm:h-[285px] lg:h-[295px] wood-rack flex flex-col px-3 py-2 z-40 shrink-0 shadow-2xl">
                        {/* 状态与辅助栏 */}
                        <div className="flex items-center justify-between px-2 mb-1.5 overflow-x-auto custom-scrollbar">
                            <div className="flex items-center gap-2 shrink-0 whitespace-nowrap">
                                <span className="text-2xl">{humanPlayer?.avatar}</span>
                                <span className="font-black text-sm text-indigo-200">{humanPlayer?.name} (你)</span>
                                <span className={`text-[11px] px-2.5 py-0.5 rounded-full font-bold ${
                                    isHumanTurn ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-slate-800 text-slate-400'
                                }`}>
                                    {isHumanTurn ? '● 轮到你的回合' : `○ 等待 ${currentPlayer?.name} 出牌`}
                                </span>
                                <span className="text-xs text-slate-400 ml-1">
                                    手牌: <b className="text-white font-mono">{humanHand.length}</b> 张
                                </span>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
                                <button
                                    onClick={provideSmartHint}
                                    disabled={!isHumanTurn}
                                    className="px-2.5 py-1 bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black rounded-lg text-xs shadow flex items-center gap-1 active:scale-95 transition-all disabled:opacity-40 border border-yellow-300"
                                >
                                    <Sparkles size={13} />
                                    <span>💡 出牌提示</span>
                                </button>

                                <button
                                    onClick={sortHandByColor}
                                    className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-bold active:scale-95"
                                >
                                    按颜色整理
                                </button>

                                <button
                                    onClick={sortHandByNumber}
                                    className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-bold active:scale-95"
                                >
                                    按数字整理
                                </button>
                            </div>
                        </div>

                        {/* 牌架主体：左侧手牌水平舒适滚动 + 右侧操作控制台 */}
                        <div className="flex-1 flex gap-3 overflow-hidden min-h-0 items-center">
                            {/* 手牌排列滑动区：只展示自己的手牌，可出牌呼吸高亮 */}
                            <div className="flex-1 h-full bg-slate-950/70 rounded-2xl px-4 py-2 flex items-center gap-3 overflow-x-auto custom-scrollbar border border-indigo-900/50 shadow-inner">
                                {humanHand.map(card => {
                                    const { canPlay, reason } = checkCardPlayability(card, topDiscard, currentColor);
                                    const isPlayable = isHumanTurn && canPlay;
                                    const isJustDrawn = justDrawnCardId === card.id;

                                    return (
                                        <div key={card.id} className="relative shrink-0 flex items-center justify-center">
                                            {isJustDrawn && (
                                                <div className="absolute -top-3.5 left-1/2 -translate-x-1/2 px-2 py-0.5 bg-emerald-500 text-slate-950 font-black text-[10px] rounded-full z-30 shadow-md whitespace-nowrap">
                                                    新摸
                                                </div>
                                            )}
                                            <UnoCard 
                                                card={card}
                                                size="hand"
                                                isPlayable={isPlayable}
                                                playReason={reason}
                                                onClick={() => isPlayable && handlePlayCard(card)}
                                            />
                                        </div>
                                    );
                                })}
                                {humanHand.length === 0 && (
                                    <div className="text-slate-400 text-sm font-bold italic px-6 flex items-center gap-2">
                                        🎉 手牌已清空！
                                    </div>
                                )}
                            </div>

                            {/* 核心动作触发台：喊 UNO! / 摸牌 / 过牌 */}
                            <div className="w-44 sm:w-52 h-full flex flex-col justify-between gap-2 shrink-0">
                                {/* 喊 UNO! 按钮 */}
                                <button
                                    onClick={handleCallUno}
                                    disabled={!isHumanTurn || playerCalledUno}
                                    className={`flex-1 rounded-2xl font-black text-sm sm:text-base shadow-xl flex items-center justify-center gap-2 active:scale-95 transition-all border-2 ${
                                        playerCalledUno 
                                            ? 'bg-emerald-600 text-white border-emerald-400 opacity-90' 
                                            : humanHand.length <= 2 
                                                ? 'bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 text-white border-yellow-300 uno-banner-pulse' 
                                                : 'bg-slate-800 text-slate-400 border-slate-700'
                                    }`}
                                >
                                    <Flame size={20} className={humanHand.length <= 2 ? 'text-yellow-300' : ''} />
                                    <span>{playerCalledUno ? '✓ 已喊 UNO!' : '🔥 喊 UNO!'}</span>
                                </button>

                                <div className="flex gap-2 flex-1">
                                    <button
                                        onClick={handleDrawCard}
                                        disabled={!isHumanTurn || drawnThisTurn}
                                        className="flex-1 bg-slate-800 hover:bg-slate-750 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold active:scale-95 transition-all disabled:opacity-40 flex flex-col items-center justify-center gap-1 whitespace-nowrap"
                                    >
                                        <Layers size={16} className="text-amber-400" />
                                        <span>摸 1 张牌</span>
                                    </button>

                                    <button
                                        onClick={handlePassTurn}
                                        disabled={!isHumanTurn || !drawnThisTurn}
                                        className={`flex-1 rounded-xl text-xs font-black shadow active:scale-95 transition-all flex flex-col items-center justify-center gap-1 whitespace-nowrap ${
                                            drawnThisTurn 
                                                ? 'bg-emerald-600 hover:bg-emerald-500 text-white animate-pulse' 
                                                : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                        }`}
                                    >
                                        <Check size={16} />
                                        <span>过牌跳过</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 获胜终局弹窗 */}
                    {gameState === 'end' && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-md safe-top-padding">
                            <div className="bg-slate-900 border-2 border-yellow-500 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-[0_0_80px_rgba(234,179,8,0.4)] animate-pop">
                                <Trophy size={64} className="text-yellow-400 mx-auto mb-2 animate-bounce" />
                                <h2 className="text-2xl sm:text-3xl font-black text-white mb-1">
                                    🎉 {winner?.name} 豪取胜利！
                                </h2>
                                <p className="text-xs sm:text-sm text-yellow-300 font-bold mb-5">
                                    清空所有手牌，本局计分: +{winner?.roundScore || 0} 分！
                                </p>

                                <div className="space-y-2 mb-6 text-left bg-slate-950/70 p-4 rounded-2xl border border-slate-800">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">手牌结算扣分</div>
                                    {players.map(p => {
                                        const sum = p.hand.reduce((acc, c) => acc + c.score, 0);
                                        return (
                                            <div key={p.id} className="flex justify-between items-center text-xs">
                                                <span className="font-bold text-slate-200 flex items-center gap-1.5">
                                                    <span>{p.avatar}</span> {p.name}
                                                </span>
                                                <span className="font-mono text-slate-400">
                                                    剩余 {p.hand.length} 张牌 ({p.hand.length === 0 ? '🏆 胜者' : `-${sum}分`})
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setGameState('setup')}
                                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-sm border border-slate-700"
                                    >
                                        返回主页
                                    </button>
                                    <button
                                        onClick={() => startNewMatch(config)}
                                        className="flex-[2] py-3 bg-gradient-to-r from-red-600 to-amber-600 text-white font-black rounded-xl text-sm shadow-xl active:scale-95"
                                    >
                                        再来一局
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UnoGame />);
    </script>
</body>
</html>
